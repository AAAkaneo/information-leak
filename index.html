 {id:"otherworld-station",title:"駅と異世界の都市伝説",subtitle:"駅・移動・境界をめぐる語りの調査枠",summary:"駅や列車を異界への入口として描く物語・投稿を調査するための構成確認用サンプルです。特定の伝承の起源や実在性を主張しません。",category:"otherworld",tags:["駅","異世界","境界","都市伝説","station"],keywords:["きさらぎ駅","異界への移動","エレベーター","railway"],foreignNames:["station legends","liminal spaces"],countries:["日本"],people:[],events:["きさらぎ駅（関連候補・未調査）"],published:"2026-10-12",updated:"2026-10-12",checkedAt:"未設定",status:["構成確認用","出典未登録"],claims:[{text:"駅を異界の入口とする語りの発祥・広がりは、このサンプルでは未確認です。",status:"出典未確認"}],sections:[{heading:"問題提起",blocks:[{type:"p",text:"駅、ホーム、改札、終電といった要素が異界譚の舞台に選ばれる理由を、作品・投稿・地域伝承ごとに資料を分けて調べるための枠です。"}]},{heading:"調査項目",blocks:[{type:"list",items:["初出として紹介される投稿・記事と、その原資料","駅名や地域が実在するか、後年の創作で変化したか","移動、境界、迷い込みを扱う他地域の伝承との比較","体験談と創作・再話の区別"]}]},{heading:"考察",blocks:[{type:"p",text:"資料がそろうまでは、駅が異界への入口として語られる理由を結論づけません。ジャンル上の演出、都市空間の経験、伝承の影響などは、検証対象となる仮説として扱います。"}]}],sources:[],relatedIds:["otherworld-station-comparison"],seriesId:"stations",part:1,originalTitle:"駅と異界のあいだ（調査用仮題）",originalLanguage:"日本語",translationNote:"海外事例を追加する際は、原語表記と翻訳者・翻訳方針を記録します。",editorNote:"構成確認用。出典未登録、調査結果未記載です。"},
 {id:"otherworld-station-comparison",title:"駅の怪談と境界の語りを比較する",subtitle:"連載サンプル・比較編",summary:"駅や移動空間を扱う伝承・都市伝説を比較する際の記録項目を示す構成確認用サンプルです。",category:"urban",tags:["駅","怪談","境界","比較"],keywords:["異界","移動","都市伝説"],foreignNames:["liminal space folklore"],countries:["調査対象未設定"],people:[],events:[],published:"2026-10-12",updated:"2026-10-12",checkedAt:"未設定",status:["構成確認用","出典未登録"],claims:[],sections:[{heading:"比較の枠組み",blocks:[{type:"p",text:"この連載回では、駅を舞台とする話を選定し、成立時期、媒体、舞台設定、語りの変化を比較する予定です。比較対象と資料はまだ登録していません。"}]},{heading:"未解明の問題",blocks:[{type:"list",items:["駅という近代的な公共空間が怪談に使われる歴史的背景","異界・境界の語りが地域を越えて似る条件","ネット上の再投稿で物語がどう変化するか"]}]}],sources:[],relatedIds:["otherworld-station"],seriesId:"stations",part:2,originalTitle:"駅の怪談と境界の語りを比較する",originalLanguage:"日本語",translationNote:"",editorNote:"構成確認用。比較結果は未記入です。"},
 {id:"ufo-definition",title:"UFOとは何か",subtitle:"用語と報告を整理するための調査枠",summary:"UFOという語の用法と、目撃報告・資料・説明を切り分けて記録する構成確認用サンプルです。個別事件の調査結果は含みません。",category:"ufo",tags:["UFO","未確認飛行物体","宇宙人","目撃報告"],keywords:["UAP","飛行物体","異常現象"],foreignNames:["UFO","UAP","unidentified anomalous phenomena"],countries:["世界各地"],people:[],events:[],published:"2026-10-12",updated:"2026-10-12",checkedAt:"未設定",status:["構成確認用","出典未登録"],claims:[],sections:[{heading:"問題提起",blocks:[{type:"p",text:"UFOは未確認の飛行物体を指す語として使われますが、報告の時代や機関によって用語・分類が異なります。このページでは、用語の定義と個別の目撃事例を別々に記録します。"}]},{heading:"調査で確認する資料",blocks:[{type:"list",items:["報告を受理・公開した機関の原資料","撮影・観測条件、日時、場所、機器情報","後日の識別や説明が公表されているか","宇宙人との関連が資料で示されているか、推測にとどまるか"]}]},{heading:"現時点の記録",blocks:[{type:"p",text:"この構成確認用ページには参考資料がありません。UFO目撃報告から地球外知性体の存在を推定する結論は記載していません。"}]}],sources:[],relatedIds:[],seriesId:null,originalTitle:"UFO / UAP",originalLanguage:"英語",translationNote:"各機関の用語定義・改訂時期を、資料ごとに記録する。",editorNote:"構成確認用。出典未登録、事件調査未実施です。"},
 {"id":"boundary-otherworld-investigation","title":"境界と異世界への迷い込み――なぜ駅・トンネル・エレベーターは異界への入口になるのか","subtitle":"怪異・超常現象資料庫｜総合調査記事（全3編）","summary":"きさらぎ駅、エレベーターゲーム、旧犬鳴トンネル、キムリンゲ駅、妖精郷・仙境譚、Backroomsを比較し、境界が異世界の入口として語られる理由と、資料から確認できる範囲を検討します。","category":"otherworld","tags":["異世界","境界","きさらぎ駅","駅","トンネル","エレベーター","民俗学","都市伝説","心理学"],"keywords":["異世界迷い込み","リミナルスペース","Backrooms","Silverpilen","犬鳴村","liminality"],"foreignNames":["liminality","liminal space","The Backrooms","Silverpilen"],"countries":["日本","スウェーデン","米国","スコットランド","中国","韓国"],"people":["Arnold van Gennep","Victor Turner","Lucia Peters"],"events":["きさらぎ駅","エレベーターゲーム","犬鳴村伝説","Silverpilen"],"published":"2026-10-12","updated":"2026-10-12","checkedAt":"2026-10-12","status":["完成稿","調査基準日 2026-10-12"],"claims":[],"sections":[{"heading":"調査全体の概要と主な発見","blocks":[{"type":"p","text":"調査基準日：2026年10月12日。記事区分：都市伝説・ネット怪談／民俗・文化／空間と心理。駅・電車・トンネル・エレベーター・扉などを「境界」として捉え、異世界迷い込み型の物語を比較します。"},{"type":"p","text":"2004年、掲示板に「きさらぎ駅」という見知らぬ駅へ到着したという投稿が現れました。普段の電車が止まらず、無人駅で降り、相談を続けるうちに線路沿いを歩き、トンネルを越えて見知らぬ人物の車に乗る展開です。最後に投稿は途絶えますが、投稿の中断だけから現実の失踪を結論することはできません。[1]"},{"type":"p","text":"本稿では、(1)物語や投稿が記録されていること、(2)舞台の施設が実在すること、(3)異世界移動が現実に起きたことを区別します。記録された伝承は超常現象の実在を証明せず、実在施設が怪談に登場することも、その施設で現象が起きた証拠にはなりません。"},{"type":"list","items":["駅・トンネル・エレベーターは、日常的な移動の前後を区切り、到着先の情報を一時的に制限する構造を持つ。これは物語上、異界への移行を描きやすくするという解釈が可能です。","異界へ入る物語はネット怪談以前にもあります。妖精郷訪問譚や中国の仙境訪問譚に構造上の類似がありますが、現代怪談への直接の伝播は確認できていません。[9][10][20]","きさらぎ駅は実在が確認されない一方、モデル候補のさぎの宮駅は実在します。旧犬鳴トンネルとキムリンゲ駅も実在施設ですが、結び付く怪談の内容と施設の実在は別問題です。[2][3][12][23]","境界怪談が他の場所の怪談より数量的に多いという結論は得られていません。今回の有名事例中心の収集は代表標本ではありません。"]}]},{"heading":"前編｜なぜ境界は異世界につながるのか","blocks":[{"type":"subsection","heading":"異世界迷い込み型の都市伝説とは","blocks":[{"type":"p","text":"異世界は必ずしも別宇宙のように明確には描かれません。普段の駅なのに誰もいない、見慣れた道の先に知らない集落がある、エレベーターを降りると建物の構造が変わる、といった日常の一部だけが変化する話も含まれます。本稿では、日常的な移動や探索の途中で通常の経験・地図と一致しない場所へ入ったと語られる話を、便宜上「異世界迷い込み型」と呼びます。これは分析上の分類で、民俗学で統一された正式な分類名ではありません。古典文学、都市伝説、創作、体験談形式の投稿は資料の性質が異なるため、同じ意味の目撃証言として扱いません。"}]},{"type":"subsection","heading":"駅・トンネル・エレベーターに共通する構造","blocks":[{"type":"p","text":"駅は時刻表や路線図に沿って出発地と目的地を結びます。存在しない駅に着く、予定外に停車しないという展開は、交通の規則から外れた異常として描けます。トンネルは入口から出口まで景色を隠し、通過前後の風景が入れ替わったような物語を作れます。エレベーターは閉じた箱で階数を移動し、表示と到着先が食い違うと異常が際立ちます。扉は開くまで向こうを見せず、階段や廊下は上下や区画をつなぎ、反復する景色を作ります。"},{"type":"p","text":"いずれも通過前後で場所が変わる施設です。物語では、その到着先を通常と異なるものに置き換えられます。これは施設の特徴と物語構造の比較から導く解釈で、怪談の発生原因を実験で確認した説明ではありません。"}]},{"type":"subsection","heading":"民俗学における境界と通過儀礼","blocks":[{"type":"p","text":"Arnold van Gennepは1909年の『通過儀礼』で、社会的状態の移行を「分離」「過渡・境界」「統合」の三段階として整理しました。Victor Turnerは中間状態を表すliminalityの概念を発展させました。[7][8]"},{"type":"p","text":"この理論は成人儀礼などの社会的・宗教的な移行を扱うもので、電車やトンネルの通過自体が儀礼になるという意味ではありません。ただし物語分析では、主人公が出発地から離れたのに通常の目的地へ着かず、「こちら側にも、あちら側にも完全には属さない」状態に置かれる構造を考える手がかりになります。理論の適用は解釈であり、都市伝説の成立原因を証明しません。"}]},{"type":"subsection","heading":"神隠し・異界訪問譚と現代の怪談","blocks":[{"type":"p","text":"山、森、洞穴、川などを通じ、人の生活圏から異なる領域へ向かう話は古くから記録されています。日本の神隠し伝承、ヨーロッパの妖精郷訪問譚、中国の山中の仙境譚は、それぞれ異なる信仰や物語環境に属します。すべてを同一の信仰体系で説明することはできません。"},{"type":"p","text":"現代の鉄道怪談との類似点は、通常の移動が日常と異なる場所への移行になる点です。しかし現代の怪談が古い伝承から直接派生したとするには、書籍・翻訳・映画・口承・投稿などの伝播経路を示す資料が必要で、今回の資料では確認できませんでした。"}]},{"type":"subsection","heading":"移動空間、知覚、リミナルスペース","blocks":[{"type":"p","text":"人の少ない駅や地下通路では、人声や動きなど普段の手がかりが失われ、設備だけが動いているように感じられることがあります。場所の理解には目印、視覚情報、経路、記憶など複数の情報が関わります。[14]"},{"type":"p","text":"健康な大学生24人を対象にした2016年の研究では、睡眠の質と仮想環境での経路探索が調べられ、低睡眠質群では課題完了が遅く誤りも多いと報告されました。[19]これは小規模な実験課題の結果で、夜間の駅での個別体験の原因を示しません。"},{"type":"p","text":"既視感（déjà vu）は新しい状況に既知感が生じる経験で、記憶や予測感との関係が研究されています。[17] 未視感（jamais vu）は知っているものが見慣れなく感じられる経験で、単語反復による実験研究があります。[16]これらは認知経験を考える手がかりですが、特定の異世界体験を説明したと断定する根拠ではありません。"},{"type":"p","text":"ネット上でいう「リミナルスペース」は、人のいない商業施設、学校、待合室、長い廊下などの違和感を表す画像文化です。文化人類学のliminalityとは関係する語ですが、同じ研究概念ではありません。Backroomsはこの種の室内の不気味さを発展させたネット創作です。[18]"}]},{"type":"subsection","heading":"境界の怪談は本当に多いのか","blocks":[{"type":"p","text":"今回の調査では、境界を舞台にした話が他の場所の異世界譚より多いと数量的に示す資料は得られませんでした。きさらぎ駅、エレベーターゲーム、Silverpilenなどの有名事例があることと、統計的な頻度は別です。比較には、怪談集・掲示板・言語・収集期間を定め、転載や翻案の重複、一話に複数の場所が出る場合の分類規則を統一する必要があります。今回の事例収集は有名例中心で、全体を代表する標本ではありません。"},{"type":"p","text":"したがって「境界怪談が最も多い」とは結論しません。一方、境界が異世界移動の筋書きを描くうえで分かりやすいこと、そして有名事例の印象が「多い」という感覚を強める可能性は、物語構造から考察できます。"}]},{"type":"p","text":"前編の結論：駅・トンネル・エレベーターは場所が変わる過程を日常的に経験する施設です。民俗学の境界概念や空間認知研究は考察の手がかりになりますが、怪談の発生原因を直接証明するものではありません。"}]},{"heading":"中編｜きさらぎ駅と実在する場所の謎","blocks":[{"type":"subsection","heading":"きさらぎ駅――2004年の掲示板投稿","blocks":[{"type":"p","text":"現存する転載記録では、起点は2004年1月8日の2ちゃんねる・オカルト超常現象板「身の回りで変なことが起こったら実況するスレ26」とされています。23時14分、投稿番号98の「気のせいかも知れませんがよろしいですか？」から始まり、投稿者は後に「はすみ」と名乗ります。[1]"},{"type":"list","items":["23時18分頃：普段の私鉄電車が通常より長く停車しないと報告。車内にほかの乗客がいるが眠っているという。","その後：見知らぬ「きさらぎ駅」に到着。駅は無人で、駅名を調べても情報が見つからないと投稿。","スレッド参加者は駅員、警察、タクシーなどを提案。投稿者は周囲の様子を続けて書き込む。","1月9日未明：線路沿いを歩き、太鼓や鈴の音、片足の男性などを記し、「伊佐貫トンネル」を通過。見知らぬ人物の車に乗る展開となる。","03時44分：転載上で最後に確認できる投稿は、携帯電話の電池が少なく、運転手の様子が変なので逃げる機会を探しているという内容。その後の続報は確認されない。"]},{"type":"p","text":"これは現在閲覧できる転載ページの内容です。2ちゃんねる運営者による公式保存ではなく、原スレッドの完全性や無改変性は独立に保証されません。投稿が途絶えたことと現実の失踪は同じではなく、投稿者が実際にどこへ行ったか、創作だったかは確認できません。[1]"}]},{"type":"subsection","heading":"2011年の後日談と派生設定","blocks":[{"type":"p","text":"「はすみが7年後に帰還した」という話は、2011年に別サイトへ投稿されたとされるコメントなどを通じて広まりました。しかし2004年の投稿者本人であるという独立した証拠や、同一人物性を示す識別情報は確認されていません。適切な表現は「本人を名乗る後年のコメント」です。[1]"},{"type":"p","text":"「やみ駅」「かたす駅」「つきのみや駅」など後発の異界駅、再話、二次創作、映画化は2004年の初期投稿と分けます。後年の設定を初期投稿の内容として扱わないよう注意が必要です。"}]},{"type":"subsection","heading":"駅とトンネルは実在するか","blocks":[{"type":"p","text":"きさらぎ駅は実在駅として確認されていません。遠州鉄道は公式ページで実在しない駅として紹介しています。[2]"},{"type":"p","text":"モデル候補として挙げられる静岡県浜松市のさぎの宮駅は実在し、所在地は浜松市中央区大瀬町417-2です。[3]投稿中の私鉄や「新浜松」の手掛かりから遠州鉄道沿線説が語られていますが、投稿者がさぎの宮駅をモデルにしたと確認されたわけではありません。遠州鉄道の2022年関連企画も後年の題材化であり、モデル説の歴史的証明ではありません。[2]"},{"type":"p","text":"投稿中の「伊佐貫トンネル」は、実在施設として所在地を確定できる資料が確認されていません。[1]"}]},{"type":"subsection","heading":"実在する未開業駅――キムリンゲとSilverpilen","blocks":[{"type":"p","text":"スウェーデンのストックホルムにはKymlinge（キムリンゲ）駅という未開業の地下鉄駅施設があります。ストックホルム地下鉄ブルーラインのHallonbergen駅とKista駅の間に建設された施設で、一般営業駅としては開業していません。Regionarkivet Stockholmが建設・未開業の経緯を紹介しています。[23]"},{"type":"p","text":"「Silverpilen（銀の矢）」と呼ばれる列車に乗ると戻れない、死者の世界へ運ばれるという伝説が結び付いています。Visit Stockholmもこの話を都市伝説として紹介します。[13]銀色のC5型車両の歴史と、死者を運んだという伝承は区別が必要です。伝承の初出時期は確定していません。キムリンゲ駅は実在しますが、怪談は史実ではありません。きさらぎ駅との直接の伝播関係も確認できませんでした。[13][23]"}]},{"type":"subsection","heading":"旧犬鳴トンネルと犬鳴村","blocks":[{"type":"p","text":"旧犬鳴トンネルは福岡県宮若市と久山町にまたがる実在のトンネルです。宮若市は公式ページで所在地・通行や侵入に関する案内を掲げ、映画『犬鳴村』はフィクションで、映画の描写は事実と異なると説明しています。[12]"},{"type":"p","text":"トンネルの先に法の及ばない村があるという話は都市伝説であり、同じ設定の村の実在が確認されたわけではありません。実在施設の名称が物語に具体性を与えても、怪談の内容が事実になるわけではありません。現地への侵入や通行を試みないでください。"}]},{"type":"subsection","heading":"エレベーターゲームの記録と発祥","blocks":[{"type":"p","text":"エレベーターゲームは、特定の階数を順番に押すと通常と異なる世界へ移動できるとするネット上の儀式型都市伝説です。韓国発祥と紹介されることがありますが、発祥は確定していません。[5][6]"},{"type":"p","text":"Lucia Petersのオンライン調査は、2008年11月22日の日本語2ちゃんねる投稿を追跡できた早期記録として紹介します。「時を戻す方法はないでしょうか？ part4」投稿736とされ、別のオカルト板投稿からの転載と説明されています。[6][22]したがって2008年の記録は絶対的な初出ではありません。"},{"type":"p","text":"韓国語圏では2010年7月11日のDaumブログが確認可能な早期例として紹介されています。[6]現在の版には、途中で現れる女性に話しかけない、到着先が暗い、電子機器が使えない、帰還操作があるなどの要素がありますが、すべてが初期版にあったとは限らず、再投稿・翻訳・改変で変化しています。日本語圏で先に確認できる記録があっても、日本発祥の証明にはならず、韓国語圏の記録も韓国発祥の証明ではありません。"}]},{"type":"table","headers":["名称","所在地・実在性","伝承との関係"],"rows":[["きさらぎ駅","架空・実在駅として未確認","2004年のネット怪談に登場。[1][2]"],["新浜松駅","静岡県浜松市・実在","投稿の出発地点に関連する手掛かりとして語られる。[1][2]"],["さぎの宮駅","浜松市中央区・実在","モデル候補。確定ではない。[2][3]"],["伊佐貫トンネル","所在地・実在性未確認","きさらぎ駅投稿内の名称。[1]"],["旧犬鳴トンネル","福岡県宮若市・久山町・実在","犬鳴村伝説と関連。立入・通行案内は自治体情報を確認。[12]"],["犬鳴村","都市伝説・映画上の村","同名設定の独立した実在村は確認されていない。[12]"],["キムリンゲ駅","スウェーデン・ストックホルム地域・未開業駅施設として実在","Silverpilenの伝説と関連。[13][23]"],["Hell’s Gate／Seven Arches","米国インディアナ州の伝承。施設の照合は未完了","列車音・地獄の門に関する口承採集。日本の事例ではない。[11]"],["Backrooms","架空の空間","実在の室内写真を背景に発展したネット創作。[18]"]]},{"type":"p","text":"中編の結論：きさらぎ駅は実在の交通機関を思わせる細部と実況形式が組み合わさっています。旧犬鳴トンネルやキムリンゲ駅のように、実在施設へ怪談が結び付く例もあります。場所の実在と超常現象の事実性は別です。"}]},{"heading":"後編｜海外の異界訪問譚と現代のリミナル空間","blocks":[{"type":"subsection","heading":"ヨーロッパの妖精郷と中国の仙境","blocks":[{"type":"p","text":"スコットランドのThomas the Rhymer伝承では、主人公が妖精の女王と出会い、妖精の国へ連れて行かれます。複数の版があり、Walter Scottによる1802年刊本や、Francis James Childの19世紀後半のバラッド集などに記録されています。[10]駅やエレベーターは登場しませんが、日常世界から異なる存在の領域へ入る構造があります。"},{"type":"p","text":"Edwin Sidney Hartlandは19世紀の比較研究で、妖精郷での滞在と人間世界の時間経過が異なる伝承を収集・比較しました。[9]これは当時の研究史資料で、現在の学界全体の合意を代表するものではありません。"},{"type":"p","text":"中国の劉晨・阮肇の仙境訪問譚は唐代の類書『藝文類聚』に『幽明録』からの引用として伝わります。二人が天台山で仙女と出会い、人間世界へ帰ると七世代が経過していたという話です。[20]ここで確認しているのは『幽明録』原本ではなく、『藝文類聚』に保存された引用文です。山を離れて仙境へ入り、帰還後に時間感覚が変わる構造は現代怪談と比較できますが、直接の系譜は確認できません。"}]},{"type":"subsection","heading":"中国の地下鉄失踪デマ","blocks":[{"type":"p","text":"人民網は2019年2月20日、北京地下鉄5号線の保守作業員が深夜に失踪したという音声情報について、運営会社が否定したと報じました。初期稿にあった「1号線」は誤りで、5号線に訂正されています。[21]"},{"type":"p","text":"確認できるのは失踪の噂と、それを否定する報道です。実際の失踪事件として扱うことはできません。また、この噂がきさらぎ駅から伝播したのか、独立して生じたのかも資料から判断できません。なお元稿の再検証時には記事本文を直接取得できず、検索表示の範囲で確認したという制約があります。[21]"}]},{"type":"subsection","heading":"Backrooms――現実から抜け落ちる無限の部屋","blocks":[{"type":"p","text":"Backroomsは、黄色がかった壁、蛍光灯、無人の室内がどこまでも続くという英語圏のネット創作です。現実から誤って「抜け落ちる」ことで入る設定が広まりました。Know Your Memeの記録では、黄色い室内画像が2018年4月21日に4chanへ投稿され、2019年5月12日に別スレッドで再掲された画像に、現実から抜け落ちるという文章が添えられたことで現在の設定へ発展しました。[18]"},{"type":"p","text":"階層・怪物・脱出方法などは動画、ゲーム、Wiki、共同創作を通じて後から追加されました。元画像の撮影場所は2024年に米国ウィスコンシン州オシュコシュの旧店舗と特定されたと二次記録が報告します。[18]実在の室内写真は、物語の無限空間の実在を示しません。"}]},{"type":"subsection","heading":"異世界迷い込み型の物語構造","blocks":[{"type":"table","headers":["事例","入口","主な異常","結末・帰還"],"rows":[["きさらぎ駅","電車・無人駅・トンネル","知らない駅、通常と異なる周囲","投稿途絶。帰還未確認。[1]"],["エレベーターゲーム","階数操作","通常と異なる階・景色","版によって帰還方法が異なる。[6]"],["犬鳴村伝説","トンネル・峠","隔絶された禁忌の村","戻れないという警告型。伝承内容。[12]"],["Silverpilen","地下鉄列車・未開業駅","死者の国へ向かう列車","帰還不能の伝説。[13][23]"],["Thomas the Rhymer","妖精との遭遇・土地の境界","妖精の国","版により展開が異なる。[10]"],["劉晨・阮肇","山・仙境への移行","異なる時間の流れ","帰還後に長い年月が経過。[20]"],["Backrooms","現実からの「抜け落ち」","無限に反復する室内","共同創作で多様。[18]"]]},{"type":"p","text":"共通して見られる場合があるのは、通常の経路から外れる、移動先で場所の規則が変わる、帰還が難しい・不明になるという展開です。すべての事例に当てはまるわけではなく、同じ筋書きから生まれた証明でもありません。"}]},{"type":"subsection","heading":"実況形式と現実味","blocks":[{"type":"p","text":"掲示板の実況では、時刻付きの投稿が追加され、他の利用者が反応し、次の報告まで結末が分からないため、読者は進行中の出来事を見守るように感じ得ます。助言に応じて移動する場面や、投稿が途絶えて結末が示されない点も臨場感を支えます。[1][4]"},{"type":"p","text":"しかしリアルタイム形式に見えることは真実性を保証しません。投稿の存在はその文章が投稿された記録であり、内容を独立に確かめるには別資料が必要です。"}]},{"type":"subsection","heading":"心理学は個別の異世界体験を説明できるか","blocks":[{"type":"p","text":"疲労、睡眠不足、方向感覚の混乱、記憶違い、既視感・未視感などは、体験談を検討するときに考えられる要因です。空間認知、睡眠と仮想空間での経路探索、睡眠機能と幻覚・妄想様体験の関連について研究があります。[14][15][16][17][19]"},{"type":"p","text":"ただし、これらの一般研究を個別の投稿に当てはめることはできません。仮想空間の経路課題の結果は、夜の駅で異世界へ行ったという投稿の原因を示しません。既視感・未視感の研究も特定の証言の診断ではありません。個別の原因を判断するには、当時の状況、本人の状態、交通記録、設備などの資料が必要です。原因不明は異世界の実在証明でもありません。"}]},{"type":"subsection","heading":"境界が異世界の入口として描かれる理由","blocks":[{"type":"list","items":["移動の前後が明確：境界を越えた先を異常な場所に置き換えられる。","通過中の情報が制限される：トンネルや閉じたエレベーターは移動先を隠せる。","日常にある：よく知る設備だから、予想が外れたときの違和感が強い。","古い異界訪問譚と構造上似る：山や森を越える物語にも日常世界から異界へ移る展開がある。ただし直接の伝播は未確認。","現代メディアと相性がよい：駅名、路線、時刻、階数などの具体情報を実況形式と組み合わせられる。"]},{"type":"p","text":"これらは複数の事例を比較した説明候補です。どれか一つがすべての怪談の原因だと証明されたわけではありません。"}]},{"type":"subsection","heading":"総合結論","blocks":[{"type":"p","text":"世界各地の異界訪問譚と現代の都市伝説には、日常空間を離れて異なる場所へ入る構造が複数の時代・地域で見られます。古い伝承では山、森、洞穴、妖精との遭遇など、現代のネット怪談では駅、電車、エレベーター、扉、廊下などがその役を担います。"},{"type":"p","text":"現時点では、駅やトンネルを舞台にする異世界譚が他の場所より統計的に多いという証拠はありません。実在するさぎの宮駅、旧犬鳴トンネル、キムリンゲ駅の存在も、超常現象の実在を示しません。エレベーターゲームでも、早期に確認できる投稿と発祥地は別問題です。"},{"type":"p","text":"境界が選ばれるのは、特別な力を持つ場所だからと確認されたためではなく、日常の「移動先への信頼」を物語の中で崩しやすいからだと考えられます。これは資料比較に基づく解釈で、すべての事例を説明する確定原因ではありません。"}]},{"type":"subsection","heading":"未解明・追加調査が必要な項目","blocks":[{"type":"list","items":["きさらぎ駅の原スレッド完全性：現存転載と原投稿を完全照合できず、欠落・改変の有無が未確認。","2011年後日談の投稿者：2004年の投稿者本人か未確認。","エレベーターゲームの発祥地：2008年投稿より前に存在したとされる元投稿を特定できていない。","Silverpilen伝説の成立年代：車両・駅の歴史と異なり、伝承の正確な初出は未確定。","境界怪談の頻度：他の場所の異世界譚との比較統計が不足。","古い妖精郷・仙境譚から現代怪談への直接の伝播経路は未確認。","個別の体験談における心理・環境要因は、一般研究から直接判断できない。"]}]}]}],"sources":[{"number":1,"title":"「身の回りで変なことが起こったら実況するスレ26」内の「きさらぎ駅」投稿転載","author":"匿名投稿者（「はすみ」名義ほか）","publication":"2004年1月8〜9日の投稿とされる／2ちゃんねる投稿の二次転載","type":"掲示板投稿転載（一次投稿の保存性に制約）", 30},{"title":"“Things That Go Bump in the Literature: An Environmental Appraisal of ‘Haunted Houses’.”","author":"Neil Dagnall, Kenneth G. Drinkwater, Ciarán O’Keeffe, Annalisa Ventola, Brian Laythe, Michael A. Jawer, Brandon Massullo, Giovanni B. Caputo & James Houran","publication":"『Frontiers in Psychology』11、2020","url":"https://doi.org/10.3389/fpsyg.2020.01328","type":"環境心理学レビュー","language":"英語","note":"幽霊屋敷研究66件のレビューと、環境要因の研究不足・測定の不一致・結果が主に無関連または弱いこと。公開本文を確認。","number":31},{"title":"Proceedings of the Society for Psychical Research, Vol. 10: “Report on the Census of Hallucinations.”","author":"Society for Psychical Research","publication":"1894","url":"https://iapsop.com/archive/materials/spr_proceedings/spr_proceedings_v10_1894.pdf","type":"心霊研究史の一次資料","language":"英語","note":"19世紀末の幻影・聴覚体験調査の実施と分類。公開PDFを確認。現代の再現実験と同等の証拠とは扱わない。","number":32},{"title":"“Retraction notice to ‘How many bereaved people hallucinate about their loved one? A systematic review and meta-analysis of bereavement hallucinations.’”","author":"Karina Stengaard Kamp & Helena Due","publication":"『Journal of Affective Disorders』250、2019、447頁","url":"https://pubmed.ncbi.nlm.nih.gov/30975434/","type":"撤回通知","language":"英語","note":"当該2018年メタ分析が撤回されたこと。撤回通知とPubMed書誌を確認。撤回理由の詳細本文は今回確認できず、数値は採用していない。","number":33,"doi":"https://doi.org/10.1016/j.jad.2019.02.067"},{"title":"“La Llorona: entre el mito, la memoria y el agua.”","author":"UNAM Global","publication":"Universidad Nacional Autónoma de México、2025","url":"https://unamglobal.unam.mx/global_revista/la-llorona-unam-mito-memoria-xochimilco/","type":"大学研究広報・文化解説","language":"スペイン語","note":"メキシコ口承におけるLa Lloronaの持続性・多形性と、Xochimilcoを含む地域の語り。公開記事を検索結果で確認。","number":34}];
ARTICLES.push({"id":"ghost-world-views-2026","title":"死者か、霊か、異界の存在か――世界の幽霊観","subtitle":"前編｜世界各国の幽霊観と霊障","summary":"「幽霊」に当たる存在を死者の魂と一律に定義せず、各地域の語彙、死生観、儀礼、語りの歴史を比較します。翻訳語のずれと資料の範囲に注意し、幽霊観の共通点と差異を整理します。","category":"folklore","tags":["幽霊","死者観","世界の伝承","祖先","ghost","gwisin","phi","jinn"],"keywords":["世界各国の幽霊観と霊障","共通する体験","異なる死者像","霊障","ghost","spirit","sleep paralysis","jinn","preta","bhūta"],"foreignNames":["ghost","spirit","guǐ","鬼","귀신","gwisin","ผี","phi","bhūta","preta","jinn","La Llorona"],"countries":["日本","中国","韓国","台湾","タイ","インド","イギリス","アメリカ","メキシコ","ナイジェリア","南アフリカ","ヨルダン"],"people":[],"events":[],"published":"未設定","updated":"2026-10-12","checkedAt":"2026-10-12","status":["調査記事","資料の確認範囲を明示"],"claims":[],"sections":[{"heading":"1. 「幽霊」は世界共通の分類名ではない","blocks":[{"type":"p","text":"日本語の幽霊は一般に死者の霊が生前の姿に近い形で現れる存在を指します。しかし、各言語の「ghost」に訳される語がすべて死者の魂を意味するわけではありません。土地の精霊、祖先、神格、悪霊、夢の訪問者、生者の幻影、異界の住人まで含まれることがあります。"},{"type":"p","text":"この差は言葉だけでなく、亡くなった人がどの儀礼を経て祖先になるのか、弔いを受けなかった死者がどうなるのか、霊が善悪どちらにもなり得るのか、生者が霊に何を求めるのかという社会関係の違いを含みます。名前だけでなく、誰が語り、どんな場面で関わり、どの儀礼で対処するのかを見る必要があります。"}]},{"heading":"2. 日本――怨霊・御霊から、近世の「幽霊」イメージへ","blocks":[{"type":"p","text":"日本の死者観は一枚岩ではありません。古代の記紀・歌謡に見られる死後観、中世の怨霊・御霊信仰、仏教の冥界観、近世の怪談や芝居が重なってきました。怨霊は恨みを残した死者が政治や社会に災いを及ぼす存在として語られ、御霊信仰では恐れられた霊を祭ることで鎮め、守護する側へ転じさせる発想が見られます。[1][2]"},{"type":"p","text":"平安期の説話・物語には死者の霊が可視化される表現があり、中世の軍記物では戦乱と結び付く武士の亡霊が現れます。江戸時代には怪談集、芝居、見世物、錦絵などを通じ幽霊表象が広く流通しました。白い死装束、乱れた長い髪、足がない姿は、古代以来不変というより時代ごとの信仰・芸能・出版で定型化した表現です。[1][2]"},{"type":"p","text":"対処には寺社での供養、法会、墓参、祭礼、鎮魂などがあります。宗教的実践は霊の存在証明ではなく、死者との関係を整える社会的・宗教的な営みでもあります。"}]},{"heading":"3. 中国――鬼（guǐ）、祖先、無縁の死者","blocks":[{"type":"p","text":"中国語の鬼（guǐ）は時代と文脈により意味が広がります。古代文献では鬼や神霊は人の生死に影響し得る存在として論じられました。『論語』の「鬼神を敬して之を遠ざく」は単純な否定ではなく、日常の人間社会を優先する態度と読む研究があります。[3][4]"},{"type":"p","text":"祖先として祀られる死者と、祭祀を受けられない孤魂・餓鬼は区別されます。仏教の餓鬼（èguǐ／preta）、道教の冥界・救済儀礼、儒教的祖先祭祀は、歴史の中で重なり合っても同じ体系ではありません。中元・盂蘭盆関連の儀礼も地域・宗派・時代で異なります。[3][4]"},{"type":"p","text":"死者は必ず恨みを抱く怪異ではなく、供養を受ける存在、家族関係に残る存在、社会秩序からこぼれ不安を生む存在など複数の姿を持ちます。"}]},{"heading":"4. 韓国――귀신（gwisin）と死者との儀礼的関係","blocks":[{"type":"p","text":"韓国語の 귀신（鬼神、gwisin）はghostと訳されますが、死者の霊だけに限りません。朝鮮時代の説話集『於于野談』を対象とした研究では、幽鬼譚が戦争、飢饉、疫病、政治的不合理を映し、儒教的説明に収まらない多様な存在として描かれます。[5]"},{"type":"p","text":"韓国巫俗には死者を慰め、あの世への移行を助ける굿（gut）があり、地域ごとに形式が異なります。結婚前に亡くなった者を結び付ける영혼결혼（霊魂結婚）も研究対象ですが、世界各地の幽霊婚と同一視できません。儀礼を通じ死者の状態に働きかける関係が重要です。[6]"}]},{"heading":"5. 台湾――無主孤魂と「好兄弟」","blocks":[{"type":"p","text":"台湾漢人社会の中元普度では、祖先と、子孫や祭祀のない孤魂滯魄が異なる形で扱われます。公的民俗資料には農暦七月を「鬼月」と呼ぶ慣習、無主の霊を「好兄弟」と婉曲に呼び、供物・灯火・道教儀礼で迎え、施食し、送り返す実践が記録されています。[7][8]"},{"type":"p","text":"基隆の中元祭研究は、餓鬼への供物だけでなく祖先祭祀、地域の結束、親族関係、富の再分配が組み合わさる行事と説明します。仏教の盂蘭盆会と道教の中元・普度は重なりますが、祭礼を単一宗教のものと決めつけるのは適切でありません。[9]"}]},{"heading":"6. タイ――ผี（phi）は死者の幽霊より広い","blocks":[{"type":"p","text":"タイ語のผี（phi）は死者の霊、祖霊、森や水の霊、村の守護霊、危険な死に方をした者の霊などを含む広い語です。タイ東北部の村落研究では、適切に扱えば守護する存在と、病気や憑依をもたらすとされる存在が語られます。善霊・悪霊の境界は固定されません。[10]"},{"type":"p","text":"村の霊媒、仏教的な力を持つ祈祷師などが異なる役割を担う事例もあります。すべてを「幽霊」と訳すと祖霊、土地の霊、怪異、霊媒活動を混同します。"}]},{"heading":"7. インド――bhūta と preta は単純な「幽霊」ではない","blocks":[{"type":"p","text":"インドの宗教・民俗世界は地域、言語、宗教、社会集団の歴史で大きく異なります。bhūtaは一部の北インド民俗研究で幅のある霊的存在の総称として記録され、pretaは死後の状態や餓鬼・亡者を指す語ですが、用法は地域・宗教文脈で異なり、統一的な「幽霊観」ではありません。[11]"},{"type":"p","text":"ネパールのネワール社会を扱う民族誌では、pretaの状態を経て祖先になる、再生する、儀礼が行われず地上に留まるといった理解が記録されます。bhūtaを死者由来のpretaと区別し独立した異界の存在とする説明もあります。家の扉や椅子の移動、病気、幻影、睡眠妨害は伝承上の霊的原因として語られますが、信仰の記録と現象の実証は別です。[12]"},{"type":"p","text":"1970年代後半に北インドの村落で行われた医療人類学的調査は、憑依とされる状態が生活、病気理解、家族関係の中で意味付けられる様子を記録しました。苦痛を否定せず、症状が文化的・社会的枠組みで解釈される事例です。[13]"}]},{"heading":"8. イギリス・欧州――帰還者から心霊研究へ","blocks":[{"type":"p","text":"イングランドの幽霊譚はキリスト教的死後観、宗教改革、啓蒙思想、印刷文化とともに変化しました。1660〜1800年の英語幽霊譚の歴史研究は、死者の帰還という考えが英国国教会・メソジストの宗教文化と結び付き、説教や読書、社交で流通したことを示します。[14]"},{"type":"p","text":"19世紀には心霊主義が英米に広がり、交霊会、物音、テーブルの動き、霊媒、写真・通信技術による死者との連絡が語られました。科学の語彙による検証主張の一方、宗教運動、悲嘆への慰め、娯楽とも結び付きました。[15][16]"},{"type":"p","text":"イタリアのアブルッツォ地方の睡眠麻痺研究では、地域の超自然的存在Pandafecheと体験を結び付ける例が報告されています。イタリア全土の一様な信仰ではなく、身体経験に地域伝承が入る事例です。[17]"}]},{"heading":"9. アメリカ――宗教的多元性と「調査される幽霊」","blocks":[{"type":"p","text":"米国には移民、キリスト教諸派、先住民の諸宗教、アフリカ系アメリカ人の宗教文化、新宗教運動などが併存し、単一の幽霊観を立てにくい地域です。先住民の宗教・霊性も民族・地域ごとに異なり、自然／超自然の二分法で一括りにしない研究が必要です。[18]"},{"type":"p","text":"現代の米国ゴーストハンティング研究では、参加者が科学機器、宗教語彙、儀礼、体験談を併用し、場所の来歴や物語を通じて「幽霊が出る」認識を形作る様子が報告されています。幽霊体験の実証ではなく、信念や調査実践の社会的構成の研究です。[16][19]"}]},{"heading":"10. メキシコ――La Llorona と死者の日を混同しない","blocks":[{"type":"p","text":"La Llorona（ラ・ヨローナ、「泣く女」）は泣き声を特徴とする広域伝承です。子どもを失った／殺した母親の霊、馬や車で現れて消える型、子どもをさらう型など、語り手・地域で異なります。[20][34]"},{"type":"p","text":"これはメキシコ全体の幽霊観ではありません。Día de Muertos（死者の日）は亡くなった家族を迎え、記憶し、供物を捧げる祭礼で、恐ろしい亡霊の怪談とは異なります。ユネスコは先住民コミュニティの祭礼を、亡くなった家族や親しい人が一時的に地上へ戻るものと説明します。[21]"}]},{"heading":"11. アフリカの事例――祖先、憑依霊、迷える死者","blocks":[{"type":"p","text":"「アフリカの幽霊観」と一括りにすべきではありません。ナイジェリア中部ルクバの研究では、死後の行方は一様でなく、再生する魂と死後に消える魂が区別され、再生を待つ間に生者を苦しめると語られる霊も記録されています。長老が祖霊となること、生者と死者の連続性も論じられます。[22]"},{"type":"p","text":"南アフリカ低地の民族誌的議論では、祖先は系譜と共同体を結び、憑依霊は災厄と能力付与の両面を持ち、幽霊は人間社会にも霊の共同体にも完全には属さない境界的存在として分析されます。[23]"}]},{"heading":"12. 中東・イスラーム圏――jinn を死者の幽霊と同一視しない","blocks":[{"type":"p","text":"ヨルダン北部の村の研究では、日本語の「幽霊」に訳されるshabahが、死者の魂でなくクルアーンにも言及されるjinnと理解される地域例が報告されています。ジンは善悪どちらもあり得る一方、害を恐れる人が多いとされます。[24]"},{"type":"p","text":"一村の事例をイスラーム圏全体へ一般化できません。教義上ジンは人間とは別に創造された存在で死者の魂とは別分類です。地域の霊的存在がジンの語彙に読み替えられる場合もあり、「中東の幽霊＝ジン」とせず、教義と地域伝承を区別します。[24][25]"}]},{"heading":"世界各地の幽霊観・比較表","blocks":[{"type":"table","headers":["地域・事例","主な語・存在","死者との関係","作用・現れ方","対処・背景","資料上の注意"],"rows":[["日本","幽霊、怨霊、御霊","死者の霊が中心。歴史的役割や語りは多様","恨み・無念・災厄の物語、個人像","供養、鎮魂、寺社祭祀。仏教・神祇・芸能が重層","白装束・足のない姿は時代を超えた普遍像ではない。[1][2]"],["中国","鬼 gui、孤魂、餓鬼 èguǐ","祖先、無縁の死者、仏教的餓鬼を区別","生死・家族・秩序に関与","祖先祭祀、道教・仏教の救済や鎮め","時代・地方・宗教で意味が変わる。[3][4]"],["韓国","귀신 gwisin、원귀 wongwi","死者の霊を含むが語は限定されない","恨み・社会的傷・政治批判の表象","巫俗굿、死者儀礼、仏教・儒教文化","古典説話研究と現代実態を区別。[5][6]"],["台湾漢人社会","孤魂滯魄、「好兄弟」","祭祀を受けない死者と祖先を儀礼上区別","旧暦七月に訪れるとされ、もてなす","中元普度、供物、放水灯、道教・仏教","基隆などの地域祭礼は全域と同一でない。[7][8][9]"],["タイ東北部","ผี phi、ผีปอบ phi pop","祖霊・自然霊・怪異を含み死者以外もいる","守護・病気・憑依など多様","霊媒、村落祭祀、仏教系祈祷師","phiは幽霊より広い。村落研究を国全体へ拡張しない。[10]"],["北インド／ネパール・ネワール","bhūta、preta","pretaは死後状態・亡者、bhūtaは独立存在の場合も","病気、幻影、睡眠妨害などが伝承上語られる","葬送・祖先儀礼、祈祷師・霊媒","境界は地域・宗派で揺れる。[11][12][13]"],["イギリス","ghost、apparition、poltergeist","キリスト教的死者の帰還、近代心霊主義の霊","屋敷・道・事件に結び付く物語や交霊体験","教会的説明、交霊会、心霊研究","信仰史の記録は実在の証明ではない。[14][15]"],["アメリカ","ghost、spirit、after-death communication","死者の霊から非人間的存在まで多様","夢、声、気配、ゴーストハント記録","宗教的多元性、心霊主義、現代調査文化","先住民を含む伝統を一括できない。[18][19]"],["メキシコ・ラテンアメリカの一部","La Lloronaなど","特定伝承では子どもを失った女性の死後像","泣く、追う、警告、消失など","口承・地域の語り。死者の日とは別","地域変異が大きく国全体を代表しない。[20][21]"],["ナイジェリア中部・南アフリカの特定集団","祖霊、憑依霊、幽霊","祖先化、再生する魂、境界的亡霊を区別","守護、憑依、苦痛、社会的記憶","祖先祭祀、儀礼、地域宗教","大陸横断的な「アフリカ型」はない。[22][23]"],["ヨルダン北部の一村","shabah、jinn","shabahを死者よりjinnと解釈する例","姿の分からない害を及ぼす存在","イスラーム教義と地域伝承","一村の民族誌で全イスラーム圏の信念ではない。[24][25]"]]}]}],"sources":WORLD_GHOST_SOURCES,"relatedIds":["ghost-world-hauntings-2026"],"seriesId":"world-ghosts-2026","part":1,"originalTitle":"死者か、霊か、異界の存在か――世界の幽霊観","originalLanguage":"日本語（一部原資料は英語・韓国語・中国語・スペイン語）","translationNote":"外国語資料は原稿記載の言語・確認範囲を維持。自動翻訳は行っていません。","editorNote":"公開日は原稿に記載がないため未設定。調査基準日は2026-10-12。"},{"id":"ghost-world-hauntings-2026","title":"目撃・声・物音・金縛り――霊障はどこまで共通するか","subtitle":"中編｜世界各国の幽霊観と霊障","summary":"人影、声、物音、接触感、睡眠麻痺、憑依を、物語のモチーフ、聞き取りによる体験、実験で確認された生理現象に分けます。「世界共通」と言える範囲と資料不足を区別します。","category":"ghost","tags":["霊障","金縛り","睡眠麻痺","目撃証言","憑依","poltergeist"],"keywords":["世界各国の幽霊観と霊障","共通する体験","異なる死者像","霊障","ghost","spirit","sleep paralysis","jinn","preta","bhūta"],"foreignNames":["ghost","spirit","guǐ","鬼","귀신","gwisin","ผี","phi","bhūta","preta","jinn","La Llorona"],"countries":["日本","イタリア","エジプト","デンマーク","インド","ネパール","タイ","韓国"],"people":[],"events":[],"published":"未設定","updated":"2026-10-12","checkedAt":"2026-10-12","status":["調査記事","資料の確認範囲を明示"],"claims":[],"sections":[{"heading":"1. 先に区別したい三種類の「証拠」","blocks":[{"type":"list","items":["物語・伝承：地域で何が幽霊らしいと語られてきたかを示すが、体験の発生をそのまま証明しない。","体験談・聞き取り・調査：何を見聞きしたと人が報告したかを示す。記憶、期待、質問方法、報告時期の影響を受ける。","実験・計測：統制条件下で再現性のある現象や相関を検討する。実験室の結果だけで個別の屋敷や体験原因を確定できない。"]},{"type":"p","text":"以下は地域の伝承や研究に現れる項目の整理で、世界共通性ランキングではありません。記録が見当たらないことも不存在の証拠ではありません。"}]},{"heading":"2. 目撃証言――人影・故人・白い服・黒い影","blocks":[{"type":"p","text":"亡くなった家族を見た、近くにいると感じた、声や匂いで気付いたという故人との感覚的体験は、悲嘆研究で複数の感覚様式にわたり記録されています。すべてを病理的幻覚と決め付けず、本人にとっての意味、苦痛、用語・測定法の差を慎重に扱います。[26]"},{"type":"p","text":"白装束、長い髪、顔のない姿、黒い影は文化や時代の表象と結び付きます。日本の白い死装束は演劇・絵画・怪談史から見る必要があり、欧米の灰色の人影や睡眠麻痺の侵入者像と同一起源とは限りません。暗所で曖昧な刺激に人型を見出すことはあり得ますが、特定の姿の伝承史は別問題です。"}]},{"heading":"3. 音・声――泣き声は物語にも体験にもなりやすい","blocks":[{"type":"p","text":"誰もいない場所の声、名前を呼ぶ声、足音、ノック、泣き声は幽霊譚のモチーフです。La Lloronaでは泣き声が物語の中心です。ただし伝承モチーフと独立の実測証言は異なります。[20]"},{"type":"p","text":"家屋のきしみ、配管、動物、風、遠方の音が声や足音に聞こえることがあります。「名前を呼ぶ声」と期待すると曖昧な音に意味を補うこともあります。これは原因を確定するのでなく、検討可能な代替仮説です。"}]},{"heading":"4. 物理的な現象――物が動く、扉が開く、電灯が点滅する","blocks":[{"type":"p","text":"物の移動や扉の開閉は、インド・ネパールの一部民族誌で霊が家に残る説明と結び付きます。[12] 西洋のpoltergeist譚では物音や物体移動が前景化し、19世紀以降の心霊研究でも記録対象になりました。しかし目撃談や歴史記録から超常的な力が動かしたとは結論できません。"},{"type":"p","text":"電化製品の故障、電灯のちらつき、寒気は現代の心霊談で語られますが、同じ条件で再現される国境横断的現象の証拠は確認されていません。配線、電圧、機器劣化、換気、気流、温度差などが候補です。原因未特定の事例もあります。"},{"type":"p","text":"「低周波音や電磁場が幽霊感覚を起こす」仮説を検討したFrenchらの2009年実験は79人を対象に超低周波音・複雑な電磁場などを操作しました。奇妙な感覚は条件と明確に結び付かず、暗示への受けやすさなどが示されました。あらゆる環境要因を否定しないものの、一般的説明を裏付けません。[27]"}]},{"heading":"5. 金縛り・圧迫感・「誰かがいる」感覚","blocks":[{"type":"p","text":"睡眠麻痺は入眠・覚醒時に一時的に動けなくなる睡眠関連現象です。意識が戻ってもREM睡眠の筋肉抑制が残り、幻覚や誰かがいる強い感覚を伴うことがあります。頻度は調査法・対象集団で異なりますが、複数地域で報告されています。[28]"},{"type":"p","text":"体験の解釈は地域で変わります。アブルッツォ地方の小規模研究ではPandafecheと結び付ける人がいました。エジプト・デンマーク比較研究も身体経験が文化的説明によって異なる形で理解され得ることを扱います。地域差は生理機序の差を直ちに意味せず、標本規模や質問票等も考慮します。[17][29]"},{"type":"p","text":"インド・ネパールの伝承にある睡眠中の圧迫や動けなさは睡眠麻痺と似る可能性がありますが、民俗上の霊名と医学的症候群を完全に同一視できません。[12]"}]},{"heading":"6. 憑依――身体の変化を社会がどう読むか","blocks":[{"type":"p","text":"憑依とされる状態には声・人格・意識の変化、病気、失神、苦痛などが含まれます。タイ東北部、北インド村落、韓国巫俗、南インドのbūta儀礼などで霊的存在との交渉や媒介者の役割が記録されています。[6][10][13][30]"},{"type":"p","text":"人類学は霊の侵入を実験で判定するより、体験者の訴え、家族・共同体の理解、儀礼の役割を記述します。必要な医学的評価を宗教説明だけで済ませることも、信仰を一律に病気へ還元することも問題です。"}]},{"heading":"霊障・心霊現象の比較表","blocks":[{"type":"table","headers":["現象","報告・伝承例","共通性の評価","別説明・限界"],"rows":[["人影・人型","日本・英米の幽霊譚、睡眠麻痺、故人の知覚体験","人型を見た大枠は複数地域にあるが同一存在とは確認できない","暗所の曖昧刺激、期待、睡眠移行期、悲嘆。証言は実在証明でない。[17][26][28]"],["故人を見る／気配","日本の怪談、英米の悲嘆研究、祖先儀礼","複数文化にあるが祖先との夢・儀礼交流と恐怖目撃は別","死後の知覚体験は研究対象。多くは病理を意味せず方法差あり。[26]"],["白い服・白装束","日本近世以降の表象、他地域の死装束","世界共通と言える資料なし","葬送習俗、演劇、映像表現に依存。[1][2]"],["顔のない人物／黒い影","現代の睡眠麻痺談、ホラー表現","現代報告はあるが同一の古い型とは未証明","視覚情報不足、脅威検知、睡眠幻覚、メディア共有。[28]"],["幽霊が突然消える","La Lloronaの一部、日本・英米の怪談","複数地域の物語モチーフ。実測共通現象ではない","伝承類型と目撃精度を分け、転載・翻案も考慮。[20]"],["同じ場所に反復出現","英国屋敷・道路、米国haunted location","場所に結び付く語りは広いが超常性の証明でない","場所の歴史、暗さ、音、期待。環境研究は限定。[19][27][31]"],["声・名前・足音・ノック","La Lloronaの泣き声、交霊会、怪談","広く報告されるが種類・背景は一致しない","建物音、動物、風、知覚補完、暗示。古いSPR調査も再現実験でない。[20][32]"],["物が動く・扉開閉","poltergeist伝承、ネワール民族誌","複数地域の伝承だが原因・独立実証データ不足","建物傾斜、気流、振動、故障、見間違い、いたずら。[12][27]"],["電化製品故障・電灯点滅","現代の怪談・ゴーストハント","古来の世界共通モチーフではなく技術依存","配線・電源・機器故障。再現性ある因果関係は未確立。[19][27][31]"],["寒気・接触感","幽霊談、睡眠麻痺、故人の感覚","主観的感覚は複数調査にあるが原因共通性不明","気流、皮膚感覚、不安、睡眠状態。研究方法の不統一。[26][28]"],["金縛り・胸圧迫・侵入者感","睡眠麻痺研究、イタリア・エジプト、ネワール伝承","身体症状の類似は明瞭。名前・原因説明は異なる","REM睡眠と覚醒の混在、睡眠不足等。超常原因の証明でない。[12][17][28][29]"],["恐怖・見られる感覚","睡眠麻痺、暗所、目撃自己報告","多くの事例で語られるが恐怖は霊の証拠でない","脅威予測、暗示、過覚醒、文化・状況。[17][28][31]"],["憑依とされる状態","韓国巫俗、タイ、インド、南インド儀礼","文化ごとに形・診断・儀礼が違う","解離、神経・精神・身体疾患、社会的苦痛など。個別評価。[6][10][13][30]"]]}]},{"heading":"7. 伝播か、独立発生か","blocks":[{"type":"p","text":"似た話があっても直ちに世界共通体験とは言えません。交易、宗教伝播、植民地支配、移民、翻訳書、映画、テレビ、ゲーム、SNSを通じて物語は移動します。日本の幽霊表象には中国文学の影響が研究され、東アジア儀礼には仏教・道教由来の共有要素があります。[1][3][4]"},{"type":"p","text":"一方、暗所で人影を誤認する、目覚め際に動けない、悲嘆中に故人を感じる経験は同一物語を借りずに生じる可能性があります。伝承の年代、接触経路、語りの細部、調査条件を照合しなければ、伝播と独立発生の寄与は判定できません。"}]}],"sources":WORLD_GHOST_SOURCES,"relatedIds":["ghost-world-views-2026","ghost-world-science-2026"],"seriesId":"world-ghosts-2026","part":2,"originalTitle":"目撃・声・物音・金縛り――霊障はどこまで共通するか","originalLanguage":"日本語（一部原資料は英語・韓国語・中国語・スペイン語）","translationNote":"外国語資料は原稿記載の言語・確認範囲を維持。自動翻訳は行っていません。","editorNote":"公開日は原稿に記載がないため未設定。調査基準日は2026-10-12。"},{"id":"ghost-world-science-2026","title":"似た体験が異なる幽霊になる理由――科学と文化の境界","subtitle":"後編｜世界各国の幽霊観と霊障","summary":"知覚・記憶、睡眠麻痺、悲嘆時の故人の感覚、環境要因、民俗学、メディア伝播を検討します。科学が説明できる範囲、個別原因が特定できない事例、未確立の仮説を分けて現在の到達点をまとめます。","category":"science","tags":["知覚","記憶","睡眠科学","悲嘆","環境心理学","心霊研究","超心理学"],"keywords":["世界各国の幽霊観と霊障","共通する体験","異なる死者像","霊障","ghost","spirit","sleep paralysis","jinn","preta","bhūta"],"foreignNames":["ghost","spirit","guǐ","鬼","귀신","gwisin","ผี","phi","bhūta","preta","jinn","La Llorona"],"countries":["世界各地","イタリア","エジプト","デンマーク","台湾"],"people":[],"events":[],"published":"未設定","updated":"2026-10-12","checkedAt":"2026-10-12","status":["調査記事","資料の確認範囲を明示"],"claims":[],"sections":[{"heading":"1. 知覚は「記録装置」ではなく、推測を含む","blocks":[{"type":"p","text":"人間の知覚は外からの情報をそのまま保存するカメラではありません。暗さ、疲労、注意、期待、恐怖、周囲の説明により曖昧な刺激に意味を与えます。枝や衣服を人影と見る、雑音から名前を聞く、物音の順序を後から物語として記憶する誤認は起こり得ます。"},{"type":"p","text":"ただし知覚の仕組みを説明できることと個々の目撃を誤認と断定することは別です。記録の乏しい体験では原因を決められない場合があります。原因不明は特定できていないという意味で、超常的原因の証明ではありません。"}]},{"heading":"2. 睡眠科学――似た身体経験、異なる文化的な物語","blocks":[{"type":"p","text":"睡眠麻痺では身体の運動抑制が残る一方、周囲を認識し幻覚や「誰かがいる」感覚を伴うことがあります。侵入者、悪霊、亡霊、ジン、魔女など身近なイメージで説明する場合があります。科学的に説明されるのは睡眠と覚醒の境界で起こる身体状態であり、体験者が使う存在名や信仰全体ではありません。[28][29]"},{"type":"p","text":"地域比較は有益ですが、標本規模・調査法は揃いません。アブルッツォ研究は67人の報告で、イタリア全国の割合とは読めません。[17] 睡眠麻痺の体系的レビューも定義・測定差を考慮しています。[28]"}]},{"heading":"3. 悲嘆と故人の感覚――体験を否定せず、霊の証明とも短絡しない","blocks":[{"type":"p","text":"家族を亡くした人が故人を見た、声や匂いを感じた、そばにいると感じた体験は悲嘆研究で記録されています。研究者は感覚的・準感覚的な故人の体験など複数の語で扱い、慰めとなる場合と苦痛となる場合を区別します。用語自体が病理や実在を先取りしないよう注意が必要です。[26]"},{"type":"p","text":"2018年の悲嘆時幻覚の有病率メタ分析はPubMedで撤回通知が確認できるため、本稿では同論文の「56.6%」を確定頻度として採用しません。[33] 数値には撤回、対象集団、定義、方法の限界の確認が要ります。"}]},{"heading":"4. 環境要因――暗闇、音、気流、電気設備","blocks":[{"type":"p","text":"幽霊屋敷研究では場所の物理環境と体験者の認知・期待の関係が検討されます。低周波音、電磁場、カビ、一酸化炭素、照明、気流などは個別現場で点検できる候補ですが、候補であることと一般的原因として実証されたことは異なります。"},{"type":"p","text":"2009年のHaunt実験は79人が電磁場と超低周波音を操作した部屋を体験し、報告感覚との関係を検討しました。明確な対応は示されず、これらの説を強く裏付けません。[27] 2020年レビューも幽霊屋敷研究の環境要因の実証不足、手法・現場調査の限界を整理しています。[31]"},{"type":"p","text":"寒かったから霊がいた、電磁波があったから霊がいるとは結論できません。異常が見つからないことも霊の証明ではありません。"}]},{"heading":"5. 民俗学・人類学――幽霊は死者との社会関係を映す","blocks":[{"type":"p","text":"幽霊譚は真偽だけでなく、どの死が悼まれるか、誰が忘れられるか、死者に何をしてほしいか、どの場所が危険とされるかを読み解く資料です。"},{"type":"p","text":"台湾の普度は無縁の死者を鎮めるだけでなく共同体の秩序や互助を確認します。[7][9] 韓国説話の鬼神が戦乱・疫病・政治的不正を表す場合があります。[5] 特定のアフリカ社会で祖先が系譜・共同体の継続を支える理解は、恐怖の対象としての幽霊とは異なります。[22][23]"},{"type":"p","text":"幽霊は生者と死者、家と外、共同体とよそ者、正しい弔いと不完全な弔いの境界として分析できます。ただしこれは比較概念であり、世界の伝承が同じ理論に従う意味ではありません。"}]},{"heading":"6. 文化交流とメディア――同じ映像文法が広がる","blocks":[{"type":"p","text":"幽霊の見た目は口承だけでなく宗教画、芝居、出版、写真、映画、テレビ、ゲーム、SNSを通じて作られます。日本の幽霊画・怪談芝居、英国ゴシック小説、米国ゴーストハント番組、東アジアのホラー映画は相互に影響してきました。[1][14][15][19]"},{"type":"p","text":"ネット投稿に黒い影、電灯の点滅、寒気があっても古来の共通伝承とは限りません。翻訳怪談や映像作品で語彙が共有された可能性があります。独立した体験か転載・影響かは初出日時、投稿履歴、文言、聞き取りで確かめます。"}]},{"heading":"7. 心霊研究・超心理学の位置づけ","blocks":[{"type":"p","text":"英国心霊研究協会（SPR）は19世紀末に幻影・テレパシー・死者の出現などを調べ、1894年に幻覚調査報告を公刊しました。歴史的な一次資料ですが、自己報告、遡及記憶、調査対象の選定などの問題があり、現代の厳密な再現実験と同等ではありません。[32]"},{"type":"p","text":"超心理学では死者との通信、テレパシー、念力などの研究が続きますが、幽霊の実在を広く受け入れられる形で再現・計測した結果は確立していません。再現性、選択的報告、偶然、実験者効果、不正防止、事前登録、独立追試が検討課題です。"}]},{"heading":"8. 何が分かり、何が分かっていないのか","blocks":[["科学的に説明できる部分",[{"type":"list","items":["睡眠麻痺の身体的仕組みと、それに伴う幻覚・存在感は睡眠科学の対象です。[28]","暗所での視覚誤認、曖昧な音から言葉を聞き取ること、期待や暗示による知覚・報告への影響は通常の認知過程で起こり得ます。[27][31]","悲嘆中に故人の気配、声、姿を経験する人がいることは研究されています。体験を直ちに精神疾患と見なす必要はありません。[26]","扉、電灯、音、温度差には点検可能な建築・電気・環境要因があります。"]}]],["説明候補はあるが個別原因を特定できない部分",[{"type":"list","items":["現場記録や設備点検が不十分な古い目撃談。","複数証言があっても同じ刺激を見たか、相互影響があったか確認できない事例。","憑依とされる症状で医学的診断と宗教的・社会的説明が併存する事例。","既知の物理要因が見つからない物音・温度変化。未知の原因が残っても超常的原因とは限らない。"]}]],["実験的裏付けが不足する主張",[{"type":"list","items":["幽霊が独立した実体として撮影・録音・計測されたという主張。","電磁場、超低周波音、特定の場所が一般に幽霊目撃を引き起こすという主張。","憑依、予知、死者との通信が独立研究で安定再現されるという主張。","世界中の類似怪談が共通の超常現象から生じたという主張。"]}]],["今後の研究課題",[{"type":"list","items":["地域・言語・宗教を越えて質問を揃えた代表性のある調査。","伝承の初出とメディア経路を追い、独立発生と伝播を区別する比較研究。","睡眠麻痺や悲嘆体験を本人の文化的説明を尊重して記録する多言語研究。","期待を統制し、音響・照明・気流・電気設備を調べる再現可能な現場研究。","心霊研究で事前登録、盲検化、データ公開、独立追試を普及させること。"]}]]]},{"heading":"総合結論――似るのは「体験の一部」、異なるのは「意味と関係」","blocks":[{"type":"p","text":"世界の資料では、死者や霊的存在が生者の生活に関わる観念が多くの地域・時代に確認できます。しかし「幽霊」という単一概念が世界中にある、誰もが同じ白い人影や黒い影を見るという強い主張は支持されません。"},{"type":"p","text":"比較的似た体験として、死者の気配、睡眠中・覚醒時に動けず誰かを感じること、暗所で人影や声を知覚することがあります。睡眠・知覚・悲嘆の働きが関与する可能性がありますが、細部や解釈は死生観、宗教、儀礼、物語、メディアで変化します。"},{"type":"p","text":"幽霊を死者の魂、敬う祖先、鎮める孤魂、あるいは死者ではないジン・自然霊と見る違いがあり、対処も供養、饗応、鎮魂、祈祷、霊媒との交渉など多様です。"},{"type":"p","text":"科学が説明できる体験の一部はありますが、全個別事例の原因が分かったわけではありません。未確定であることは幽霊の実在証明ではありません。体験者の誠実さと感情を尊重し、伝承・証言・測定・再現実験を別々に評価することが比較調査の出発点です。"}]},{"heading":"未解明・追加調査が必要な項目","blocks":[{"type":"list","items":["中国語・韓国語・スペイン語の一次資料と現地語の伝承集を増やす。","アフリカの比較地域を増やし、異なる民族・言語・宗教共同体を扱う。","ヨルダン一村の記録から中東・イスラーム圏全体を推定せず、教義資料と地域民族誌を比較する。","「白い服」「顔のない人」「電灯の点滅」等を同じ質問票で比較する世界横断調査。","怪談の年代・媒体を追い、伝播経路と独立発生を区別する。","個別心霊スポットの同時代資料、現場測定、証言独立性、設備点検記録を調べる。","撤回メタ分析に依存せず、悲嘆時の体験について質の高い代表性・多文化研究を確認する。"]}]}],"sources":WORLD_GHOST_SOURCES,"relatedIds":["ghost-world-hauntings-2026"],"seriesId":"world-ghosts-2026","part":3,"originalTitle":"似た体験が異なる幽霊になる理由――科学と文化の境界","originalLanguage":"日本語（一部原資料は英語・韓国語・中国語・スペイン語）","translationNote":"外国語資料は原稿記載の言語・確認範囲を維持。自動翻訳は行っていません。","editorNote":"公開日は原稿に記載がないため未設定。調査基準日は2026-10-12。"});


ARTICLES.find(a=>a.id==='ghost-world-views-2026').sections.unshift({heading:'調査全体の概要・調査上の制約',blocks:[
 {type:'p',text:'この調査では、幽霊に当たる存在を「死者の魂が人前に現れるもの」と一律に定義せず、各地域の語彙、死生観、儀礼、語りの歴史を比較しました。日本語の「幽霊」に英語のghost、中国語の鬼（guǐ）、韓国語の귀신（gwisin）、タイ語のผี（phi）、サンスクリット由来のbhūta／preta、アラビア語圏のjinnなどをそのまま置き換えると、死者・神霊・精霊・悪霊・独立した異界の存在が混同されます。'},
 {type:'p',text:'確認した資料では、死者が生者に影響する観念や死者との交渉は幅広い地域にあります。しかし全人類に例外なく存在することを示す比較資料はなく、「世界中で同じ幽霊が信じられている」とは言えません。祖先として敬う文化、儀礼を欠いた死者を鎮める文化、死者ではない霊的存在を恐れる文化など、分類と関係の結び方に差があります。'},
 {type:'p',text:'人影、声、気配、接触感、睡眠中の圧迫感など、体験の一部には地域をまたいで似た報告があります。一方、白装束、顔のない姿、黒い影、電灯の点滅が世界共通だという強い証拠は確認できません。伝承、聞き取り、映像作品、ネット投稿は証拠の種類が異なるため、同じ「報告」として合算しません。'},
 {type:'p',text:'睡眠麻痺では覚醒に近い意識とREM睡眠に伴う筋肉の運動抑制が重なり、動けない感覚、胸の圧迫、侵入者・人影の幻覚、誰かがいる感覚が起こり得ます。この説明は本人の体験を作り話とするものではありません。原因を特定できないことも超常的原因の証明ではありません。'},
 {type:'p',text:'地域ごとに研究の厚さは異なります。本稿で扱う日本・中国・韓国・台湾・タイ・インド・英米・メキシコ・アフリカの特定地域・ヨルダンの事例は、各国全体の代表ではありません。アフリカ、南アジア、先住民社会を一つの文化としてまとめず、各資料が対象にする時代・場所・集団に限って記述します。'}
]});

function sectionBlock(title,sub,items){const sec=document.createElement('section');sec.className='section';const head=document.createElement('div');head.className='section-head';const h=document.createElement('h2');h.textContent=title;const s=document.createElement('span');s.className='subtle';s.textContent=sub;head.append(h,s);sec.append(head);const cards=document.createElement('div');cards.className='cards';if(items.length===0)cards.append(empty('記事はまだありません。'));items.forEach(item=>{if(item.series){const c=document.createElement('div');c.className='card';const b=document.createElement('span');b.className='badge';b.textContent='連載';const h=document.createElement('h3');h.textContent=item.series.title;const ol=document.createElement('ol');item.series.articleIds.map(id=>ARTICLES.find(a=>a.id===id)).filter(Boolean).forEach(a=>{const li=document.createElement('li');const l=document.createElement('a');l.href=articleHref(a.id);l.textContent=a.title;li.append(l);ol.append(li)});c.append(b,h,ol);cards.append(c)}else cards.append(card(item))});sec.append(cards);return sec}
function sortedArticles(){return [...ARTICLES].sort((a,b)=>(b.updated||'').localeCompare(a.updated||''))}
function showListing(opts={},fromRoute=false){currentFilter={view:'list',query:opts.query??currentFilter.query,category:opts.category??'',tag:opts.tag??''};if(!fromRoute){const params=new URLSearchParams();if(currentFilter.query)params.set('q',currentFilter.query);if(currentFilter.category)params.set('category',currentFilter.category);if(currentFilter.tag)params.set('tag',currentFilter.tag);history.pushState(null,'','#search'+(params.size?'?'+params.toString():''))}app.innerHTML='';const section=document.createElement('section');section.className='view';const back=document.createElement('div');back.className='backrow';const home=document.createElement('a');home.href='#home';home.textContent='← トップへ';back.append(home);section.append(back);const h=document.createElement('h1');h.textContent=currentFilter.query?`「${currentFilter.query}」の検索結果`:currentFilter.tag?`タグ：${currentFilter.tag}`:currentFilter.category?catName(currentFilter.category):'全記事一覧';section.append(h);const form=document.createElement('form');form.className='searchbox';form.innerHTML='<input class="field" type="search" aria-label="記事を検索" placeholder="記事を検索"><button class="btn" type="submit">検索</button>';form.querySelector('input').value=currentFilter.query;form.addEventListener('submit',e=>{e.preventDefault();showListing({query:form.querySelector('input').value,category:currentFilter.category,tag:currentFilter.tag})});section.append(form);let found=sortedArticles().filter(a=>(!currentFilter.category||a.category===currentFilter.category)&&(!currentFilter.tag||(a.tags||[]).includes(currentFilter.tag))&&(!currentFilter.query||allSearchText(a).includes(currentFilter.query.toLocaleLowerCase())));const bar=document.createElement('div');bar.className='resultbar';bar.innerHTML=`該当件数：<strong>${found.length}</strong> 件`;section.append(bar);const cards=document.createElement('div');cards.className='cards';found.forEach(a=>cards.append(card(a)));if(!found.length){const message=currentFilter.category&&!currentFilter.query&&!currentFilter.tag?'このジャンルの記事はまだありません。':'該当する記事はありません。語句を変えるか、カテゴリーを選び直してください。';cards.append(empty(message))}section.append(cards);app.append(section);window.scrollTo(0,0)}
function addText(parent,tag,text,cls){const n=document.createElement(tag);if(cls)n.className=cls;n.textContent=esc(text);parent.append(n);return n}
function appendCitedText(parent,text,sourceCount=0){const value=esc(text);const re=/\[(\d+)\]/g;let from=0,m;while((m=re.exec(value))){parent.append(document.createTextNode(value.slice(from,m.index)));if(Number(m[1])<=sourceCount){const a=document.createElement('a');a.href='#source-'+m[1];a.textContent='['+m[1]+']';a.setAttribute('aria-label','参考資料 '+m[1]+' へ');parent.append(a)}else parent.append(document.createTextNode(m[0]));from=re.lastIndex}parent.append(document.createTextNode(value.slice(from)))}
function renderBlock(parent,b,sourceCount=0){if(b.type==='subsection'){addText(parent,'h3',b.heading);(b.blocks||[]).forEach(x=>renderBlock(parent,x,sourceCount))}else if(b.type==='table'){const wrap=document.createElement('div');wrap.className='table-scroll';wrap.setAttribute('role','region');wrap.setAttribute('aria-label','比較表（横にスクロールできます）');wrap.tabIndex=0;const table=document.createElement('table');table.className='article-table';const thead=document.createElement('thead');const trh=document.createElement('tr');(b.headers||[]).forEach(x=>{const th=document.createElement('th');appendCitedText(th,x,sourceCount);trh.append(th)});thead.append(trh);table.append(thead);const tbody=document.createElement('tbody');(b.rows||[]).forEach(row=>{const tr=document.createElement('tr');row.forEach(x=>{const td=document.createElement('td');appendCitedText(td,x,sourceCount);tr.append(td)});tbody.append(tr)});table.append(tbody);wrap.append(table);parent.append(wrap)}else if(b.type==='list'){const ul=document.createElement('ul');(b.items||[]).forEach(x=>{const li=document.createElement('li');appendCitedText(li,x,sourceCount);ul.append(li)});parent.append(ul)}else if(b.type==='quote'){const q=document.createElement('blockquote');appendCitedText(q,b.text||'',sourceCount);parent.append(q)}else{const p=document.createElement('p');appendCitedText(p,b.text||'',sourceCount);parent.append(p)}}
function renderArticle(id){const a=ARTICLES.find(x=>x.id===id);if(!a){app.innerHTML='';const box=document.createElement('section');box.className='view';addText(box,'h1','記事が見つかりません');addText(box,'p','指定された記事IDは登録されていないか、削除されています。','subtle');const l=document.createElement('a');l.href='#home';l.textContent='トップへ戻る';box.append(l);app.append(box);return}currentFilter.view='article';app.innerHTML='';const page=document.createElement('section');page.className='view article';const back=document.createElement('div');back.className='backrow';const l=document.createElement('a');l.href='#home';l.textContent='← 一覧へ戻る';back.append(l);page.append(back);
 const head=document.createElement('header');head.className='article-head';const badges=document.createElement('div');badges.append(makeBadge(catName(a.category)));if(a.status?.includes('構成確認用'))badges.append(makeBadge('構成確認用','demo'));head.append(badges);addText(head,'h1',a.title);if(a.subtitle)addText(head,'p',a.subtitle,'subtitle');const meta=document.createElement('div');meta.className='meta';[['公開日',a.published||'未設定'],['更新日',a.updated||'未設定'],['調査基準日',a.checkedAt||'未設定'],['地域',(a.countries||[]).join('、')||'未設定']].forEach(([k,v])=>{const span=document.createElement('span');span.textContent=k+'：'+v;meta.append(span)});head.append(meta);addText(head,'p',a.summary);(a.status||[]).forEach(s=>head.append(makeBadge(s,'demo')));page.append(head);
 if(a.seriesId){const sr=SERIES.find(s=>s.id===a.seriesId);if(sr){const sb=document.createElement('div');sb.className='seriesbox';addText(sb,'strong','特集：'+sr.title);addText(sb,'div',`全${sr.articleIds.length}編中 ${a.part||sr.articleIds.indexOf(a.id)+1}編目`,'subtle');const ol=document.createElement('ol');sr.articleIds.forEach((sid,i)=>{const sa=ARTICLES.find(x=>x.id===sid);if(!sa)return;const li=document.createElement('li');if(sid===a.id){li.className='current';li.textContent=sa.title+'（現在の記事）'}else{const al=document.createElement('a');al.href=articleHref(sid);al.textContent=sa.title;li.append(al)}ol.append(li)});sb.append(ol);const idx=sr.articleIds.indexOf(a.id);if(idx>0){const prev=ARTICLES.find(x=>x.id===sr.articleIds[idx-1]);const pl=document.createElement('a');pl.href=articleHref(prev.id);pl.textContent='← 前の記事';sb.append(pl)}if(idx>=0&&idx<sr.articleIds.length-1){const next=ARTICLES.find(x=>x.id===sr.articleIds[idx+1]);const nl=document.createElement('a');nl.href=articleHref(next.id);nl.textContent=(idx>0?'　':'')+'次の記事 →';sb.append(nl)}page.append(sb)}}
 const layout=document.createElement('div');layout.className='article-layout';const body=document.createElement('div');body.className='article-body';const sourceCount=(a.sources||[]).length;const sections=[{heading:'概要',blocks:[{type:'p',text:a.summary||'概要は未登録です。'}]},...(a.sections||[])];sections.forEach((s,i)=>{const sec=document.createElement('section');sec.className='article-section';sec.id='sec-'+i;addText(sec,'h2',s.heading);(s.blocks||[]).forEach(b=>renderBlock(sec,b,sourceCount));body.append(sec)});
 if(a.claims?.length){const sec=document.createElement('section');sec.className='article-section';sec.id='claims';addText(sec,'h2','主張・確認状況');a.claims.forEach(c=>{const box=document.createElement('div');box.className='claim';addText(box,'strong',c.status||'確認状況未設定');addText(box,'div',c.text);sec.append(box)});body.append(sec)}
 const sourceSec=document.createElement('section');sourceSec.className='article-section';sourceSec.id='sources';addText(sourceSec,'h2','参考資料');if(a.sources?.length){const ol=document.createElement('ol');ol.className='source-list';a.sources.forEach((s,i)=>{const li=document.createElement('li');li.value=s.number||i+1;li.id='source-'+li.value;let validUrl=false;try{const parsed=new URL(s.url);validUrl=parsed.protocol==='https:'||parsed.protocol==='http:'}catch(_){}if(validUrl){const al=document.createElement('a');al.href=s.url;al.target='_blank';al.rel='noopener noreferrer';al.textContent=s.title||'資料名未登録';li.append(al)}else addText(li,'span',s.title||'資料名未登録');if(s.doi){let doiUrl;try{doiUrl=new URL(s.doi)}catch(_){}if(doiUrl&&['https:','http:'].includes(doiUrl.protocol)){const dl=document.createElement('a');dl.href=s.doi;dl.target='_blank';dl.rel='noopener noreferrer';dl.textContent=' DOI';li.append(dl)}}if(s.author)addText(li,'span',' — '+s.author);addText(li,'div',`${s.publication||'発行情報未記載'} / ${s.type||'種類未設定'} / 原文：${s.language||'未設定'} / URL・DOI：${s.url||'未登録'} / 確認範囲：${s.note||'未記載'}`,'source-type');if(s.claim)addText(li,'div','関連する主張：'+s.claim);if(s.note)addText(li,'div',s.note);ol.append(li)});sourceSec.append(ol)}else{addText(sourceSec,'p','参考資料は未登録です。出典を確認した記事として扱わないでください。')}body.append(sourceSec);
 const info=document.createElement('section');info.className='article-section';info.id='metadata';addText(info,'h2','記録情報');[['記事ID',a.id],['原語タイトル',a.originalTitle||'未登録'],['原文の言語',a.originalLanguage||'未登録'],['人物',(a.people||[]).join('、')||'未登録'],['関連する事件',(a.events||[]).join('、')||'未登録'],['翻訳メモ',a.translationNote||'なし'],['編集メモ',a.editorNote||'なし']].forEach(([k,v])=>{const p=document.createElement('p');const strong=document.createElement('strong');strong.textContent=k+'：';p.append(strong,document.createTextNode(v));info.append(p)});if(a.tags?.length){addText(info,'h3','タグ');a.tags.forEach(t=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.addEventListener('click',()=>showListing({tag:t}));info.append(b)})}body.append(info);
 const rel=(a.relatedIds||[]).map(rid=>ARTICLES.find(x=>x.id===rid)).filter(Boolean);if(rel.length){const sec=document.createElement('section');sec.className='article-section';sec.id='related';addText(sec,'h2','関連記事');const links=document.createElement('div');links.className='related';rel.forEach(r=>{const al=document.createElement('a');al.className='chip';al.href=articleHref(r.id);al.textContent=r.title;links.append(al)});sec.append(links);body.append(sec)}
 const aside=document.createElement('aside');aside.className='article-aside sidebox';addText(aside,'h2','この記事の目次');const toc=document.createElement('nav');toc.className='toc';sections.forEach((s,i)=>{const al=document.createElement('a');al.href='#sec-'+i;al.textContent=s.heading;toc.append(al)});[['参考資料','#sources'],['記録情報','#metadata'],...(rel.length?[['関連記事','#related']]:[])].forEach(([t,href])=>{const al=document.createElement('a');al.href=href;al.textContent=t;toc.append(al)});aside.append(toc);layout.append(body,aside);page.append(layout);app.append(page);window.scrollTo(0,0)}
function makeBadge(text,kind=''){const b=document.createElement('span');b.className='badge '+kind;b.textContent=text;return b}
function route(){const raw=location.hash.slice(1);if(!raw||raw==='home'){renderHome();return}if(raw.startsWith('sec-')||raw.startsWith('source-')){document.getElementById(raw)?.scrollIntoView({behavior:'smooth'});return}if(raw.startsWith('article/')){let id='';try{id=decodeURIComponent(raw.slice(8))}catch(_){id=raw.slice(8)}renderArticle(id);return}if(raw.startsWith('search')){const queryPart=raw.includes('?')?raw.slice(raw.indexOf('?')+1):'';const p=new URLSearchParams(queryPart);showListing({query:p.get('q')||'',category:p.get('category')||'',tag:p.get('tag')||''},true);return}if(raw==='categories'){renderHome();document.getElementById('categories')?.scrollIntoView();return}renderHome()}
function searchTop(q){showListing({query:q})}$('#topSearchForm').addEventListener('submit',e=>{e.preventDefault();searchTop($('#topSearch').value)});
window.addEventListener('hashchange',route);window.addEventListener('popstate',route);$('#toTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));route();
